name: CI

on:
    workflow_call:
        inputs:
            source_ref:
                required: false
                type: string
                default: ''
    workflow_dispatch:
    push:
        branches:
            - main
            - release
    pull_request:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    EVOKE_MILESTONE_MODEL_URL: ${{ vars.EVOKE_MILESTONE_MODEL_URL }}
    EVOKE_MILESTONE_MODEL_ARCHIVE_SHA256: ${{ vars.EVOKE_MILESTONE_MODEL_ARCHIVE_SHA256 }}
    II42_MILESTONE_MODEL_URL: ${{ vars.II42_MILESTONE_MODEL_URL }}
    II42_MILESTONE_MODEL_ARCHIVE_SHA256: ${{ vars.II42_MILESTONE_MODEL_ARCHIVE_SHA256 }}

permissions:
    contents: read

jobs:
    build-test:
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                pg_major: [17, 18]

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  ref: ${{ inputs.source_ref || github.sha }}

            - name: Read extension version
              id: version
              run: |
                  version="$(sed -n "s/^default_version = '\\(.*\\)'$/\\1/p" \
                    ii42.control)"
                  echo "version=${version}" >> "${GITHUB_OUTPUT}"

            - name: Install PostgreSQL toolchain
              run: ./scripts/install_postgres_apt.sh "${{ matrix.pg_major }}"

            - name: Check active script syntax
              run: |
                  python3 -m compileall -q scripts tests
                  find scripts packaging \
                    -type f -name '*.sh' -print0 \
                    | xargs -0 -n1 bash -n

            - name: Run Python product unit tests
              run: |
                  product_tests="${RUNNER_TEMP:-/tmp}/evoke-product-tests.txt"
                  find tests -maxdepth 1 -type f -name 'test_*.py' \
                    ! -name 'test_ng*.py' \
                    ! -name 'test_prepare_ng*.py' \
                    ! -name 'test_review_ng*.py' \
                    -print | sort > "${product_tests}"
                  python3 -m pytest -q $(
                    cat "${product_tests}"
                  )

            - name: Verify product convergence inventory
              run: python3 scripts/test_product_convergence_inventory.py

            - name: Install ONNX Runtime C SDK
              run: |
                  prefix="${RUNNER_TEMP}/onnxruntime"
                  ./scripts/install_onnxruntime_c.sh \
                    --version "$(cat packaging/onnxruntime.version)" \
                    --prefix "${prefix}"
                  echo "PKG_CONFIG_PATH=${prefix}/lib/pkgconfig" \
                    >> "${GITHUB_ENV}"
                  echo "LD_LIBRARY_PATH=${prefix}/lib" \
                    >> "${GITHUB_ENV}"

            - name: Add PostgreSQL binaries to PATH
              run: |
                  echo "/usr/lib/postgresql/${{ matrix.pg_major }}/bin" \
                    >> "${GITHUB_PATH}"

            - name: Build unit tests
              run: |
                  cmake -S . -B build_tmp
                  cmake --build build_tmp

            - name: Run unit tests
              run: ctest --test-dir build_tmp --output-on-failure

            - name: Run sanitized unit tests
              if: matrix.pg_major == 18
              run: |
                  cmake -S . -B build_sanitized \
                    -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' \
                    -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
                  cmake --build build_sanitized
                  ASAN_OPTIONS=detect_leaks=1 \
                    ctest --test-dir build_sanitized --output-on-failure

            - name: Build extension without ONNX Runtime
              run: |
                  make clean
                  make II42_ENABLE_ONNXRUNTIME=0 \
                    PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg_major }}/bin/pg_config
                  make clean

            - name: Build extension
              run: |
                  make clean
                  make II42_ENABLE_ONNXRUNTIME=1 \
                    PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg_major }}/bin/pg_config

            - name: Start temporary PostgreSQL
              run: |
                  cluster_dir="${RUNNER_TEMP}/pg${{ matrix.pg_major }}"
                  socket_dir="${RUNNER_TEMP}/pgsocket${{ matrix.pg_major }}"
                  port="55${{ matrix.pg_major }}"
                  initdb -D "${cluster_dir}" -A trust -U postgres >/dev/null
                  mkdir -p "${socket_dir}"
                  pg_ctl \
                    -D "${cluster_dir}" \
                    -l "${cluster_dir}/postgres.log" \
                    -o "-F -k ${socket_dir} -p ${port}" \
                    start
                  createdb \
                    -h "${socket_dir}" \
                    -p "${port}" \
                    -U postgres \
                    contrib_regression
                  {
                      echo "PGHOST=${socket_dir}"
                      echo "PGPORT=${port}"
                      echo "PGUSER=postgres"
                  } >> "${GITHUB_ENV}"

            - name: Run integration tests
              run: |
                  sudo --preserve-env=PKG_CONFIG_PATH make install \
                    II42_ENABLE_ONNXRUNTIME=1 \
                    PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg_major }}/bin/pg_config
                  if ! make installcheck \
                    II42_ENABLE_ONNXRUNTIME=1 \
                    PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg_major }}/bin/pg_config; then
                      if [ -f regression.diffs ]; then
                          cat regression.diffs
                      fi
                      if [ -f regression.out ]; then
                          cat regression.out
                      fi
                      exit 1
                  fi

            - name: Run extension schema placement smoke
              run: |
                  python3 scripts/test_extension_schema_smoke.py \
                    --psql \
                    /usr/lib/postgresql/${{ matrix.pg_major }}/bin/psql

            - name: Run preloaded ONNX Runtime smoke
              run: |
                  python3 scripts/test_onnxruntime_smoke.py \
                    --pg-bin \
                    /usr/lib/postgresql/${{ matrix.pg_major }}/bin

            - name: Fetch frozen milestone model
              if: >-
                  matrix.pg_major == 18 &&
                  (
                    env.EVOKE_MILESTONE_MODEL_URL != '' ||
                    env.II42_MILESTONE_MODEL_URL != ''
                  )
              run: |
                  ./scripts/fetch_milestone_model_for_ci.sh \
                    "${RUNNER_TEMP}/evoke-milestone-model"

            - name: Build and verify release archive
              if: >-
                  matrix.pg_major == 18 &&
                  (
                    env.EVOKE_MILESTONE_MODEL_URL != '' ||
                    env.II42_MILESTONE_MODEL_URL != ''
                  )
              run: |
                  ./scripts/build_release_zip.sh \
                    --version "${{ steps.version.outputs.version }}" \
                    --onnxruntime-prefix "${RUNNER_TEMP}/onnxruntime" \
                    --pg-config \
                    /usr/lib/postgresql/${{ matrix.pg_major }}/bin/pg_config
                  archive="$(
                    find dist -maxdepth 1 -type f -name '*.zip' -print -quit
                  )"
                  test -n "${archive}"
                  (
                    cd dist
                    sha256sum -c "$(basename "${archive}").sha256"
                  )
                  extract_root="${RUNNER_TEMP}/evoke-release"
                  mkdir -p "${extract_root}"
                  unzip -q "${archive}" -d "${extract_root}"
                  find "${extract_root}" -type l \
                    -name 'libonnxruntime.so*' -print -quit \
                    | grep -q .
                  grep -F "Git commit: $(git rev-parse HEAD)" \
                    "${extract_root}"/*/BUILD-INFO.txt
                  grep -F 'Git tree: clean' \
                    "${extract_root}"/*/BUILD-INFO.txt
                  find "${extract_root}" -path \
                    '*/ii42/models/default/manifest.json' -print -quit \
                    | grep -q .

            - name: Stop temporary PostgreSQL
              if: always()
              run: |
                  cluster_dir="${RUNNER_TEMP}/pg${{ matrix.pg_major }}"
                  if [ -f "${cluster_dir}/postmaster.pid" ]; then
                      pg_ctl -D "${cluster_dir}" -m fast stop
                  fi

    docker-pg18:
        if: >-
            vars.EVOKE_MILESTONE_MODEL_URL != '' ||
            vars.II42_MILESTONE_MODEL_URL != ''
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  ref: ${{ inputs.source_ref || github.sha }}

            - name: Read extension version
              id: version
              run: |
                  version="$(sed -n "s/^default_version = '\\(.*\\)'$/\\1/p" \
                    ii42.control)"
                  echo "version=${version}" >> "${GITHUB_OUTPUT}"

            - name: Fetch frozen milestone model
              run: |
                  ./scripts/fetch_milestone_model_for_ci.sh \
                    "${RUNNER_TEMP}/evoke-milestone-model"

            - name: Build PostgreSQL 18 Docker image
              run: |
                  ./scripts/build_release_docker_image.sh \
                    --version "${{ steps.version.outputs.version }}" \
                    --image-tag evoke:ci-pg18

            - name: Smoke test Docker image
              run: |
                  container_name="evoke-ci-pg18"
                  docker rm -f "${container_name}" >/dev/null 2>&1 || true
                  docker run -d \
                    --name "${container_name}" \
                    --tmpfs /var/run/postgresql:rw,mode=3775,uid=999,gid=999 \
                    -e POSTGRES_HOST_AUTH_METHOD=trust \
                    evoke:ci-pg18
                  trap 'docker rm -f "${container_name}" >/dev/null 2>&1 || true' EXIT
                  for _ in $(seq 1 60); do
                      if docker exec "${container_name}" \
                          pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then
                          break
                      fi
                      sleep 1
                  done
                  docker exec "${container_name}" \
                    psql -U postgres -d postgres -Atqc \
                    "SELECT extname FROM pg_extension WHERE extname = 'ii42';" \
                    | grep -x 'ii42'
                  docker exec "${container_name}" \
                    psql -U postgres -d postgres -Atqc \
                    "SELECT ii42_onnxruntime_build_info();" \
                    | grep -q '^enabled:'
                  docker exec "${container_name}" \
                    psql -U postgres -d postgres -Atqc \
                    "SELECT ii42_onnxruntime_probe();" \
                    | grep -q '^available:'
                  docker exec "${container_name}" \
                    test -s \
                    /usr/share/postgresql/18/ii42/models/default/manifest.json
                  docker exec "${container_name}" \
                    psql -U postgres -d postgres -Atqc \
                    "SELECT ii42_runtime_service_status()->>'shared_memory_available';" \
                    | grep -x 'true'
