name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            tag_name:
                description: Reviewed release tag to publish
                required: true
                default: ''
                type: string

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    EVOKE_MILESTONE_MODEL_URL: ${{ vars.EVOKE_MILESTONE_MODEL_URL }}
    EVOKE_MILESTONE_MODEL_ARCHIVE_SHA256: ${{ vars.EVOKE_MILESTONE_MODEL_ARCHIVE_SHA256 }}

permissions:
    contents: read

concurrency:
    group: release-${{ inputs.tag_name || github.ref_name }}
    cancel-in-progress: false

jobs:
    validate:
        uses: ./.github/workflows/ci.yml
        with:
            source_ref: ${{ inputs.tag_name || github.ref }}

    build-release-assets:
        needs: validate
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                pg_major: [17, 18]

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

            - name: Resolve version
              id: version
              run: |
                  if [ "${{ github.event_name }}" = 'workflow_dispatch' ] &&
                     [ -n "${{ inputs.tag_name }}" ]; then
                      tag_version="${{ inputs.tag_name }}"
                      tag_version="${tag_version#v}"
                  else
                      tag_version="${GITHUB_REF_NAME#v}"
                  fi
                  control_version="$(sed -n \
                    "s/^default_version = '\\(.*\\)'$/\\1/p" \
                    evoke.control)"
                  if [ -n "${tag_version}" ] &&
                     [ "${tag_version}" != "${control_version}" ]; then
                      echo "tag version ${tag_version} does not match control version ${control_version}" >&2
                      exit 1
                  fi
                  echo "version=${control_version}" >> "${GITHUB_OUTPUT}"

            - name: Install PostgreSQL toolchain
              run: ./scripts/install_postgres_apt.sh "${{ matrix.pg_major }}"

            - name: Install ONNX Runtime C SDK
              run: |
                  prefix="${RUNNER_TEMP}/onnxruntime"
                  ./scripts/install_onnxruntime_c.sh \
                    --version "$(cat packaging/onnxruntime.version)" \
                    --prefix "${prefix}"
                  echo "PKG_CONFIG_PATH=${prefix}/lib/pkgconfig" \
                    >> "${GITHUB_ENV}"
                  echo "LD_LIBRARY_PATH=${prefix}/lib" \
                    >> "${GITHUB_ENV}"

            - name: Fetch frozen milestone model
              run: |
                  ./scripts/fetch_milestone_model_for_ci.sh \
                    "${RUNNER_TEMP}/evoke-milestone-model"

            - name: Build release zip
              run: |
                  ./scripts/build_release_zip.sh \
                    --version "${{ steps.version.outputs.version }}" \
                    --onnxruntime-prefix "${RUNNER_TEMP}/onnxruntime" \
                    --pg-config /usr/lib/postgresql/${{ matrix.pg_major }}/bin/pg_config

            - name: Verify release zip
              run: |
                  shopt -s nullglob
                  version="${{ steps.version.outputs.version }}"
                  files=(dist/evoke-v${version}-*-pg${{ matrix.pg_major }}.zip)
                  if [ "${#files[@]}" -ne 1 ]; then
                      printf 'expected one release zip, found %s\n' \
                        "${#files[@]}" >&2
                      exit 1
                  fi
                  checksum="${files[0]}.sha256"
                  test -s "${files[0]}"
                  test -s "${checksum}"
                  unzip -l "${files[0]}" \
                    | grep -q 'libonnxruntime\.so'
                  unzip -l "${files[0]}" \
                    | grep -q 'LICENSES/ONNXRUNTIME-LICENSE'
                  unzip -l "${files[0]}" \
                    | grep -q 'LICENSES/EVOKE-LICENSE'
                  unzip -l "${files[0]}" \
                    | grep -q 'evoke/models/default/manifest\.json'
                  unzip -l "${files[0]}" \
                    | grep -q 'LICENSES/MILESTONE-MODEL-NOTICE'
                  (
                      cd dist
                      sha256sum -c "$(basename "${checksum}")"
                  )

            - name: Upload release artifacts
              uses: actions/upload-artifact@v6
              with:
                  name: release-pg${{ matrix.pg_major }}
                  path: |
                      dist/*.zip
                      dist/*.zip.sha256
                  if-no-files-found: error

    build-docker-release-image:
        needs: validate
        outputs:
            image_digest: ${{ steps.publish.outputs.image_digest }}
        permissions:
            contents: read
            packages: write
        runs-on: ubuntu-24.04

        steps:
            - name: Checkout
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}

            - name: Resolve version
              id: version
              run: |
                  control_version="$(sed -n \
                    "s/^default_version = '\\(.*\\)'$/\\1/p" \
                    evoke.control)"
                  echo "version=${control_version}" >> "${GITHUB_OUTPUT}"

            - name: Fetch frozen milestone model
              run: |
                  ./scripts/fetch_milestone_model_for_ci.sh \
                    "${RUNNER_TEMP}/evoke-milestone-model"

            - name: Build PostgreSQL 18 Docker image
              run: |
                  ./scripts/build_release_docker_image.sh \
                    --version "${{ steps.version.outputs.version }}" \
                    --image-tag evoke:release-pg18

            - name: Smoke test Docker image
              run: |
                  container_name="evoke-release-pg18"
                  docker rm -f "${container_name}" >/dev/null 2>&1 || true
                  docker run -d \
                    --name "${container_name}" \
                    --tmpfs /var/run/postgresql:rw,mode=3775,uid=999,gid=999 \
                    -e POSTGRES_HOST_AUTH_METHOD=trust \
                    evoke:release-pg18
                  trap 'docker rm -f "${container_name}" >/dev/null 2>&1 || true' EXIT
                  for _ in $(seq 1 60); do
                      if docker exec "${container_name}" \
                          pg_isready -h 127.0.0.1 -U postgres >/dev/null 2>&1; then
                          break
                      fi
                      sleep 1
                  done
                  docker exec "${container_name}" \
                    psql -U postgres -d postgres -Atqc \
                    "SELECT extname FROM pg_extension WHERE extname = 'evoke';" \
                    | grep -x 'evoke'
                  docker exec "${container_name}" \
                    psql -U postgres -d postgres -Atqc \
                    "SELECT evoke_onnxruntime_build_info();" \
                    | grep -q '^enabled:'
                  docker exec "${container_name}" \
                    psql -U postgres -d postgres -Atqc \
                    "SELECT evoke_onnxruntime_probe();" \
                    | grep -q '^available:'
                  docker exec "${container_name}" \
                    psql -U postgres -d postgres -Atqc \
                    "SELECT evoke_runtime_service_status()->>'shared_memory_available';" \
                    | grep -x 'true'
                  docker exec "${container_name}" \
                    test -s \
                    /usr/share/postgresql/18/evoke/models/default/manifest.json

            - name: Verify portable Docker archive checksum
              run: |
                  archive="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
                  test -s "${archive}"
                  gzip -t "${archive}"
                  (
                      cd dist
                      sha256sum "$(basename "${archive}")" > "$(basename "${archive}").sha256"
                      sha256sum -c "$(basename "${archive}").sha256"
                  )

            - name: Upload Docker archive
              uses: actions/upload-artifact@v6
              with:
                  name: release-docker-pg18
                  path: |
                      dist/*.tar.gz
                      dist/*.tar.gz.sha256
                  if-no-files-found: error

            - name: Log in to GitHub Container Registry
              env:
                  GHCR_TOKEN: ${{ github.token }}
              run: |
                  export DOCKER_CONFIG="${RUNNER_TEMP}/docker-ghcr"
                  mkdir -p "${DOCKER_CONFIG}"
                  printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io \
                    --username "${GITHUB_ACTOR}" --password-stdin
                  echo "DOCKER_CONFIG=${DOCKER_CONFIG}" >> "${GITHUB_ENV}"

            - name: Publish Docker image to GitHub Packages
              id: publish
              run: |
                  ./scripts/publish_docker_image.sh \
                    --source-tag evoke:release-pg18 \
                    --target-image "ghcr.io/${GITHUB_REPOSITORY,,}" \
                    --tag "pg18-v${{ steps.version.outputs.version }}"
                  image="ghcr.io/${GITHUB_REPOSITORY,,}"
                  digest="$(docker buildx imagetools inspect \
                    "${image}:pg18-v${{ steps.version.outputs.version }}" \
                    --format '{{.Manifest.Digest}}')"
                  [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
                  echo "image_digest=${digest}" >> "${GITHUB_OUTPUT}"

    publish-release:
        runs-on: ubuntu-24.04
        needs: [build-release-assets, build-docker-release-image]
        permissions:
            actions: read
            contents: write
        steps:
            - name: Download release artifacts
              uses: actions/download-artifact@v6
              with:
                  pattern: release-*
                  path: release-assets
                  merge-multiple: true

            - name: Verify checksums and publish release assets
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
              run: |
                  cd release-assets
                  shopt -s nullglob
                  checksums=(*.sha256)
                  test "${#checksums[@]}" -eq 3
                  for checksum in "${checksums[@]}"; do
                      sha256sum -c "${checksum}"
                  done
                  assets=(*.zip *.tar.gz *.sha256)
                  test "${#assets[@]}" -eq 6
                  if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
                      gh release upload "${TAG_NAME}" "${assets[@]}" --clobber
                  else
                      gh release create "${TAG_NAME}" "${assets[@]}" \
                        --title "Evoke ${TAG_NAME} (Beta)" \
                        --generate-notes --verify-tag --latest=false
                  fi

    promote-release:
        needs: [publish-release, build-docker-release-image]
        permissions:
            contents: write
            packages: write
        uses: ./.github/workflows/promote-release.yml
        with:
            tag_name: ${{ inputs.tag_name || github.ref_name }}
            image_digest: ${{ needs.build-docker-release-image.outputs.image_digest }}
